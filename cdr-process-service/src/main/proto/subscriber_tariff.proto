syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.tariff.grpc";
option java_outer_classname = "SubscriberTariffProtocol";

service SubscriberTariffService {
  rpc GetTariff (TariffRequest) returns (TariffResponse);
}

message TariffRequest {
  string phone_number = 1;
}

message TariffResponse {
  string tariff_type = 1;
}
