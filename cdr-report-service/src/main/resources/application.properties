spring.application.name=cdr-report-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cdr_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Bu servis sadece okur; tablo veya CDR verisi olusturmaz.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

logging.level.com.example.cdrreport=INFO
